plugins { id 'com.android.application' }

// Release signing, if a key has been set up. keystore.properties and the .jks itself are
// git-ignored and never leave this machine: whoever holds them is the only person who can
// publish an update the device will accept over an existing install. Without the file the
// release build still runs, it just comes out unsigned - see docs/build-install.md.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

android {
    namespace 'org.eversolo.winamp'
    compileSdk 34

    lint {
        // targetSdk 29 is deliberate (see below). Lint treats a low targetSdk as a fatal
        // error because Google Play rejects it - a store rule, not a correctness one, and
        // this app is sideloaded onto one streamer.
        disable 'ExpiredTargetSdkVersion'
    }

    defaultConfig {
        applicationId "org.eversolo.winamp"
        minSdk 26
        // targetSdk 29 + requestLegacyExternalStorage is the combination proven to give
        // direct file access on this device (ANSWERS_Q1_Q7.md Q1). A sideloaded app has
        // no Play Store targeting requirement, so this is safe and deliberate.
        targetSdk 29
        // BUMP THIS EVERY BUILD YOU INTEND TO INSTALL. The device's web installer at :18888
        // silently keeps the existing app when the versionCode has not changed - which
        // looks exactly like "the new code did nothing".
        versionCode 37
        versionName "1.3.3-lyrics"
    }
    signingConfigs {
        if (keystoreFile.exists()) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        // The debug build carries a skin in src/debug/assets so it runs straight away on the
        // owner's own device. The release build deliberately does not: the classic skin is
        // Nullsoft's artwork and is not ours to redistribute (THIRD-PARTY-NOTICES.md), so a
        // downloaded build asks for one on first run.
        debug { minifyEnabled false }
        release {
            minifyEnabled false
            if (keystoreFile.exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
dependencies {
    implementation project(':core')
    implementation project(':library')
    implementation project(':playback')
    implementation project(':playlist')
    implementation project(':skin')
    implementation project(':dsp')
}
